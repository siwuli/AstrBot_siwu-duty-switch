name: duty_switch
display_name: 上下班开关
desc: "上下班开关（按群独立生效）：在每个群里 @兔兔「上班/下班」只影响该群——下班后该群消息全部静默（不回复、不触发插件、不调用 LLM），其余群不受影响；支持管理员权限校验与状态持久化，重启 AstrBot 后保持各群状态"
help: "在某个群里对兔兔说「下班」，该群消息将全部静默（不回复、不触发任何插件），其余群不受影响；在同一个群说「上班」恢复。指令需 @ 兔兔 或唤醒词触发（如「兔兔下班」），默认仅群主/管理员可执行"
version: 1.1.0
author: siwuli
repo: https://github.com/siwuli/AstrBot_siwu-duty-switch
astrbot_version: ">=4.0.0"
