name: duty_switch
display_name: 上下班开关
desc: "通过「上班 / 下班」指令让兔兔作息：下班后静默拦截群内所有消息（不回复、不触发插件、不调用 LLM），上班后恢复；支持管理员权限校验与状态持久化，重启 AstrBot 后保持状态"
help: "对兔兔说「上班」恢复接收群消息；说「下班」进入休息状态（群消息全部静默不回复），直到再次「上班」。指令需 @ 兔兔 或唤醒词触发（如「兔兔下班」），默认仅群主/管理员可执行"
version: 1.0.0
author: siwuli
repo: https://github.com/siwuli/AstrBot_siwu-duty-switch
astrbot_version: ">=4.0.0"
