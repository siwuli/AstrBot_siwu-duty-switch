name: duty_switch
display_name: 上下班开关
desc: "按群独立的上下班开关：下班后该群消息全部静默（不回复、不触发插件、不调用 LLM），支持权限控制、拟人化提示与持久化"
help: "在某个群里对兔兔说「下班」，该群消息将全部静默（不回复、不触发任何插件），其余群不受影响；在同一个群说「上班」恢复，会提示休息了多久。指令需 @ 兔兔 或唤醒词触发（如「兔兔下班」），默认仅群主/管理员可执行"
version: 1.2.1
author: siwuli
repo: https://github.com/siwuli/AstrBot_siwu-duty-switch
astrbot_version: ">=4.0.0"
