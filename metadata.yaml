desc: "上下班开关（按群独立生效 + 人性化提示）：在每个群里 @兔兔「上班/下班」只影响该群——下班后该群消息全部静默（不回复、不触发插件、不调用 LLM），其余群不受影响；提示回复采用拟人化口吻（打卡上班啦~ / 哼~ >.<），机器人自称与对用户称呼可在配置中修改，支持休息时长提示与状态持久化"
help: "在某个群里对兔兔说「下班」，该群消息将全部静默（不回复、不触发任何插件），其余群不受影响；在同一个群说「上班」恢复，会提示休息了多久。指令需 @ 兔兔 或唤醒词触发（如「兔兔下班」），默认仅群主/管理员可执行"
